<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>메모를 남기자! - Cozy Daily Memo</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="style1.css" />
  </head>
  <body class="memo-body">
    <header class="topbar">
      <a class="back-link" href="index.html">메인으로</a>
      <div>
        <p class="eyebrow">Cozy Daily Memo</p>
        <h1 class="page-title">메모를 남기자!</h1>
      </div>
      <button class="ghost-btn sound-btn" id="soundToggle" type="button">
        음악 켜기
      </button>
    </header>

    <main class="memo-shell">
      <section class="writer-panel">
        <form id="memoWriter" class="memo-form">
          <label class="field-label" for="memo">새 메모</label>
          <textarea
            id="memo"
            name="memo"
            placeholder="오늘의 메모를 입력하세요."
            required
          ></textarea>
          <div class="form-actions">
            <button class="primary-btn" type="submit">작성</button>
            <button class="ghost-btn" id="resetButton" type="button">
              리셋
            </button>
          </div>
        </form>
      </section>

      <section class="list-panel">
        <div class="section-head">
          <h2>메모 목록</h2>
          <button class="ghost-btn small-btn" id="clearAll" type="button">
            전체 삭제
          </button>
        </div>
        <p class="list-hint">저장된 메모는 브라우저에 남아 있습니다.</p>
        <section id="memoList" class="memo-list" aria-live="polite"></section>
        <section id="emptyState" class="empty-state">
          <p>아직 작성된 메모가 없어요.</p>
        </section>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
