<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            transition: transform 0.2s ease, box-shadow 0.2s ease;

<body class="bg-background text-on-surface font-body-md min-h-screen pb-32">
<!-- Top AppBar (from JSON guidance) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin-desktop py-base bg-surface/80 backdrop-blur-md">
<div class="flex items-center gap-sm">
<button class="p-2 hover:bg-primary-container/20 rounded-full transition-colors active:scale-95 duration-150 ease-in-out">
<span class="material-symbols-outlined text-primary">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">My Memos</h1>
</div>
<button class="p-2 hover:bg-primary-container/20 rounded-full transition-colors active:scale-95 duration-150 ease-in-out">
<span class="material-symbols-outlined text-primary">account_circle</span>
</button>
</header>
<main class="max-w-[1200px] mx-auto px-margin-mobile md:px-margin-desktop pt-32">
<!-- Hero Section -->
<section class="text-center mb-lg">
<h2 class="font-display-lg text-display-lg text-primary mb-xs">메모를 남기자!</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">오늘의 생각을 가볍게 기록해보세요.</p>
</section>
<!-- Input Area -->
<section class="max-w-2xl mx-auto mb-xl">
<form class="bg-surface-container-low p-md rounded-xl shadow-[0_4px_12px_rgba(115,92,0,0.05)] border-2 border-transparent focus-within:border-secondary transition-all" id="memoWriter">
<textarea class="w-full bg-transparent border-none focus:ring-0 font-body-md text-on-surface placeholder:text-outline h-32 resize-none" id="memoContent" name="memo" placeholder="오늘의 메모를 입력하세요." required=""></textarea>
<div class="flex justify-end mt-sm">
<button class="squishy-button bg-primary-container text-on-primary-container font-label-md text-label-md px-lg py-sm rounded-full flex items-center gap-base transition-all" type="submit">
<span class="material-symbols-outlined">save</span>
                        기록하기
                    </button>
</div>
</form>
</section>
<!-- List Area -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-md" id="memoList">
<!-- Memo cards will be injected here -->
</div>
<!-- Empty State (Hidden by default) -->
<div class="hidden flex-col items-center justify-center py-xl text-on-surface-variant opacity-60" id="emptyState">
<span class="material-symbols-outlined text-[64px] mb-base">note_stack</span>
<p class="font-headline-sm text-headline-sm">아직 작성된 메모가 없어요.</p>
</div>
</main>
<!-- Bottom Navigation Bar (from JSON guidance) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center pt-sm pb-gutter px-4 bg-surface/90 backdrop-blur-lg rounded-t-xl shadow-[0_-4px_12px_rgba(115,92,0,0.05)] md:hidden">
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1 active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined">description</span>
<span class="font-label-md text-label-md">Memos</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-all" href="#">
<span class="material-symbols-outlined">inventory_2</span>
<span class="font-label-md text-label-md">Archive</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-all" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-md text-label-md">Settings</span>
</a>
</nav>
<!-- Script for functionality -->
<script>
        const memoForm = document.getElementById('memoWriter');
        const memoList = document.getElementById('memoList');
        const emptyState = document.getElementById('emptyState');
        const memoContent = document.getElementById('memoContent');

        // Color palettes for Post-it notes
        const bgColors = [
            'bg-primary-container', // Yellow
            'bg-secondary-container', // Mint
            'bg-tertiary-container' // Peach
        ];

        let memos = JSON.parse(localStorage.getItem('memos')) || [];

        function saveMemos() {
            localStorage.setItem('memos', JSON.stringify(memos));
        }

        function createMemoCard(memo, index) {
            const card = document.createElement('div');
            const colorClass = bgColors[index % bgColors.length];
            card.className = `memo-card ${colorClass} p-md rounded-xl shadow-[0_4px_12px_rgba(115,92,0,0.05)] relative flex flex-col justify-between min-h-[160px] cursor-default`;
            
            const dateStr = new Date(memo.id).toLocaleDateString('ko-KR', { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            });

            card.innerHTML = `
                <div class="flex justify-between items-start mb-sm">
                    <span class="text-[12px] font-bold text-on-surface/40 uppercase tracking-wider">${dateStr}</span>
                    <div class="flex gap-xs">
                        <button onclick="deleteMemo(${memo.id})" class="text-on-surface/40 hover:text-error transition-colors p-1 rounded-full hover:bg-surface/20">
                            <span class="material-symbols-outlined text-[18px]">delete</span>
                        </button>
                    </div>
                </div>
                <p class="font-body-md text-on-surface-variant flex-grow leading-relaxed whitespace-pre-wrap">${memo.text}</p>
                <div class="absolute top-0 right-0 w-8 h-8 opacity-20 pointer-events-none" style="background: linear-gradient(225deg, transparent 50%, #000 50%); border-bottom-left-radius: 8px;"></div>
            `;
            return card;
        }

        function renderMemos() {
            memoList.innerHTML = '';
            if (memos.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
                memos.forEach((memo, index) => {
                    memoList.appendChild(createMemoCard(memo, index));
                });
            }
        }

        function deleteMemo(id) {
            memos = memos.filter(m => m.id !== id);
            saveMemos();
            renderMemos();
        }

        memoForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = memoContent.value.trim();
            if (text) {
                const newMemo = {
                    id: Date.now(),
                    text: text
                };
                memos.unshift(newMemo);
                saveMemos();
                renderMemos();
                memoContent.value = '';
                
                // Visual feedback
                const btn = memoForm.querySelector('button');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> 기록됨!';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                }, 2000);
            }
        });

        // Initial render
        renderMemos();
    </script>
</body></html>
